[project]
name = "unemployedbumbuddy"
version = "0.1.0"
description = "Autonomous, human-supervised job application agent"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34",
]

[project.optional-dependencies]
adapters = ["httpx>=0.27", "playwright>=1.45"]
pipeline = ["numpy>=1.26"]
telegram = ["httpx>=0.27"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.ruff]
line-length = 100
